<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- التدرجات اللونية الفاخرة -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- خلفية الدرع الدائري المائل للأبطال -->
  <rect width="512" height="512" rx="130" fill="url(#shieldBg)"/>

  <!-- هالة الإشعاع النوراني -->
  <circle cx="256" cy="220" r="180" fill="url(#haloGlow)"/>

  <!-- إطار الدرع الذهبي الخارجي -->
  <path d="M 256 42 
           C 390 42 450 90 450 200 
           C 450 330 340 425 256 465 
           C 172 425 62 330 62 200 
           C 62 90 122 42 256 42 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        filter="url(#goldGlow)"/>

  <!-- درع داخلي أخضر زمردي إسلامي -->
  <path d="M 256 58 
           C 375 58 430 102 430 204 
           C 430 318 330 405 256 445 
           C 182 405 82 318 82 204 
           C 82 102 137 58 256 58 Z" 
        fill="url(#emeraldGrad)" 
        opacity="0.92" 
        filter="url(#dropShadow)"/>

  <!-- وشاح البطل الخارق الأحمر الطائر في الخلفية -->
  <path d="M 180 250 C 130 280 110 380 145 420 C 175 390 195 340 210 290 Z" fill="#ef4444" opacity="0.95"/>
  <path d="M 332 250 C 382 280 402 380 367 420 C 337 390 317 340 302 290 Z" fill="#dc2626" opacity="0.95"/>

  <!-- كتاب القرآن ونور الحكمة المفتوح في الوسط -->
  <g transform="translate(256, 310)">
    <!-- صفحات الكتاب المفتوح الذهبي -->
    <path d="M -85 30 C -45 15 -10 25 0 35 C 10 25 45 15 85 30 L 75 70 C 40 55 10 65 0 72 C -10 65 -40 55 -75 70 Z" fill="url(#goldGrad)"/>
    <path d="M -80 34 C -43 20 -10 28 0 37 C 10 28 43 20 80 34 L 72 66 C 38 52 10 60 0 67 C -10 60 -38 52 -72 66 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- هلال ذهبي إسلامي يعانق نجمة خماسية مشعة -->
  <g transform="translate(256, 175) scale(1.15)">
    <!-- الهلال الماسي -->
    <path d="M 22 -65 
             A 68 68 0 1 0 70 35 
             A 54 54 0 1 1 22 -65 Z" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)"/>

    <!-- نجمة البطل المسلم الخماسية اللامعة -->
    <path d="M 15 -25 
             L 22 -6 L 42 -6 L 26 6 L 32 26 L 15 14 L -2 26 L 4 6 L -12 -6 L 8 -6 Z" 
          fill="#ffffff" 
          filter="url(#goldGlow)"/>
  </g>

  <!-- نجوم لمعان كرتونية محيطة -->
  <g fill="#fef08a">
    <circle cx="140" cy="130" r="6"/>
    <circle cx="370" cy="130" r="6"/>
    <polygon points="360,110 365,120 375,125 365,130 360,140 355,130 345,125 355,120" opacity="0.8"/>
    <polygon points="150,110 155,120 165,125 155,130 150,140 145,130 135,125 145,120" opacity="0.8"/>
  </g>

  <!-- شريط لافتة البطل المسلم الذهبية في الأسفل -->
  <g transform="translate(256, 435)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#dropShadow)"/>
    <text x="0" y="8" font-family="'Cairo', 'Noto Naskh Arabic', sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">البَطَلُ المُسْلِم</text>
  </g>
</svg>
