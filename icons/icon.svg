<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
  </defs>

  <!-- خلفية دائرية لطيفة -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- شمس مشرقة -->
  <circle cx="410" cy="110" r="48" fill="url(#sun)"/>

  <!-- تلال خضراء -->
  <ellipse cx="256" cy="480" rx="300" ry="90" fill="#22c55e"/>
  <ellipse cx="140" cy="490" rx="220" ry="80" fill="#16a34a"/>

  <!-- جذع الشجرة -->
  <path d="M 230 460 L 244 320 L 268 320 L 282 460 Z" fill="url(#trunk)"/>

  <!-- كتل أوراق الشجرة الخضراء الكرتونية -->
  <circle cx="210" cy="270" r="65" fill="#15803d"/>
  <circle cx="302" cy="270" r="65" fill="#15803d"/>
  <circle cx="256" cy="220" r="80" fill="#16a34a"/>
  <circle cx="210" cy="210" r="65" fill="#22c55e"/>
  <circle cx="295" cy="210" r="65" fill="#22c55e"/>
  <circle cx="256" cy="170" r="65" fill="#4ade80"/>

  <!-- أزهار وثمار -->
  <circle cx="230" cy="210" r="14" fill="#ef4444"/>
  <circle cx="290" cy="240" r="14" fill="#f97316"/>
  <circle cx="210" cy="280" r="14" fill="#f43f5e"/>
  <circle cx="310" cy="180" r="14" fill="#eab308"/>

  <!-- قطرة ماء متلألئة -->
  <path d="M 256 60 C 256 60 216 110 216 135 C 216 157 234 175 256 175 C 278 175 296 157 296 135 C 296 110 256 60 256 60 Z" fill="#0284c7" opacity="0.9"/>
